services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - srp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    image: srpanel:latest
    restart: unless-stopped
    command: ["sh", "/app/docker/entrypoint.sh", "web"]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${SRP_TZ:-Asia/Tehran}
      SRP_BACKUP_DIR: /app/backups
      SRP_UPLOAD_DIR: /app/uploads
    volumes:
      - srp_backups:/app/backups
      - srp_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  worker:
    image: srpanel:latest
    restart: unless-stopped
    command: ["sh", "/app/docker/entrypoint.sh", "worker"]
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: ${SRP_TZ:-Asia/Tehran}
      SRP_BACKUP_DIR: /app/backups
      SRP_UPLOAD_DIR: /app/uploads
    volumes:
      - srp_backups:/app/backups
      - srp_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SRP_DOMAIN: ${SRP_DOMAIN:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - srp_caddy_data:/data
      - srp_caddy_config:/config
    depends_on:
      - web

volumes:
  srp_pgdata:
  srp_caddy_data:
  srp_caddy_config:
  srp_backups:
  srp_uploads:
